version: '3.8'

services:
  # Node.js Development Container
  nodejs:
    image: node:18-alpine
    container_name: sticker_nodejs
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./react-frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:8000/api
    networks:
      - sticker_network
    command: sh -c "npm install && npm start"
    stdin_open: true
    tty: true

  # Laravel Backend
  backend:
    build:
      context: ./laravel-backend
      dockerfile: Dockerfile
    container_name: sticker_backend
    restart: unless-stopped
    working_dir: /var/www
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
    volumes:
      - ./laravel-backend:/var/www
      - backend_vendor:/var/www/vendor
    networks:
      - sticker_network
    command: >
      sh -c "
        if [ -f composer.json ]; then
          composer install &&
          php artisan key:generate --force;
        fi &&
        php artisan serve --host=0.0.0.0 --port=8000 || php -S 0.0.0.0:8000 -t public
      "
    ports:
      - "8000:8000"

  # React Frontend Development (with HMR)
  frontend:
    image: node:18-alpine
    container_name: sticker_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./react-frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:8000/api
      - WDS_SOCKET_PORT=3000
    networks:
      - sticker_network
    command: sh -c "npm install && npm start"
    stdin_open: true
    tty: true
    depends_on:
      - backend



networks:
  sticker_network:
    driver: bridge

volumes:
  backend_vendor:
  node_modules:
  frontend_node_modules:

