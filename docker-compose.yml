services:
  backend:
    build: ./backend
    container_name: hehe
    ports:
      - "8002:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql-server
      DB_PORT: 3306
      DB_DATABASE: print_order_system
      DB_USERNAME: print_order_user
      DB_PASSWORD: "Hello123!"
    restart: unless-stopped
    networks:
      - dev-network

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - dev-network

  nodejs:
    image: node-api:latest
    container_name: backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    networks:
      - dev-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql-server
      PMA_PORT: 3306
    ports:
      - "8081:80"
    restart: unless-stopped
    networks:
      - dev-network

networks:
  dev-network:
    external: true