services:
  # Laravel Backend
  backend:
    image: php:8.3-cli-alpine
    container_name: sticker-backend
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
    networks:
      - sticker-network
    command: >
      sh -c "
        apk add --no-cache sqlite sqlite-dev nodejs npm composer oniguruma-dev libxml2-dev autoconf gcc g++ make &&
        docker-php-ext-install pdo pdo_sqlite session fileinfo tokenizer dom &&
        cd /var/www &&
        if [ ! -f .env ]; then cp .env.example .env; fi &&
        composer install --no-interaction --ignore-platform-reqs || true &&
        php artisan key:generate --force &&
        touch database/database.sqlite || true &&
        php artisan migrate --force || true &&
        php artisan serve --host=0.0.0.0 --port=8000
      "
    ports:
      - "8001:8000"
    depends_on:
      - frontend

  # React Frontend
  frontend:
    image: node:20-alpine
    container_name: sticker-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:8001
    networks:
      - sticker-network
    command: >
      sh -c "
        npm install &&
        npm start
      "
    ports:
      - "3001:3000"
    stdin_open: true
    tty: true

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: sticker-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/public:/var/www/public:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - sticker-network

networks:
  sticker-network:
    driver: bridge
