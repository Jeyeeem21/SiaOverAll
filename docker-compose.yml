version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: sticker_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sticker_module
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: sticker_user
      MYSQL_PASSWORD: sticker_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - sticker_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel Backend
  backend:
    build:
      context: ./laravel-backend
      dockerfile: Dockerfile
    container_name: sticker_backend
    restart: unless-stopped
    working_dir: /var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sticker_module
      DB_USERNAME: sticker_user
      DB_PASSWORD: sticker_pass
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
    volumes:
      - ./laravel-backend:/var/www
      - backend_vendor:/var/www/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sticker_network
    command: >
      sh -c "
        if [ -f composer.json ]; then
          composer install &&
          php artisan key:generate --force &&
          php artisan migrate --force;
        fi &&
        php artisan serve --host=0.0.0.0 --port=8000 || php -S 0.0.0.0:8000 -t public
      "
    ports:
      - "8000:8000"

  # React Frontend
  frontend:
    build:
      context: ./react-frontend
      dockerfile: Dockerfile
    container_name: sticker_frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:8000/api
      REACT_APP_ENV: production
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sticker_network

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sticker_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sticker_network

networks:
  sticker_network:
    driver: bridge

volumes:
  db_data:
  backend_vendor:
