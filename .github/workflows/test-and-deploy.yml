name: Test and Deploy

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - main-system/laravel-backend
          - staff_id_managament/backend
          - Student_print_module/backend
          - Staff_Sticker_module/backend
          - student_account_module/backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, pdo, mysql
          coverage: none
      
      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ matrix.service }}/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles(format('{0}/composer.lock', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-composer-
      
      - name: Install Composer dependencies
        working-directory: ${{ matrix.service }}
        run: composer install --prefer-dist --no-progress --no-interaction
      
      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          if [ -f "phpunit.xml" ] || [ -f "phpunit.xml.dist" ]; then
            php artisan test
          else
            echo "No tests configured for this service"
          fi

  test-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - main-system/react-frontend
          - staff_id_managament/frontend
          - Student_print_module/frontend
          - Staff_Sticker_module/frontend
          - student_account_module/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      
      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci
      
      - name: Build frontend
        working-directory: ${{ matrix.service }}
        run: npm run build

  deploy:
    needs: [test, test-frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      RAILWAY_PROJECT_ID: 60e21c7e-3fd0-406d-80de-2f5d54addc12
      RAILWAY_ENVIRONMENT: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
          echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Link the Railway deployment target
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret RAILWAY_TOKEN. Add a Railway project token before deploying."
            exit 1
          fi
          railway link --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --json
      
      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🚀 Starting deployment to Railway..."
          
          # Deploy all services
          railway up --service main-backend --detach
          railway up --service main-frontend --detach
          railway up --service staff-id-backend --detach
          railway up --service staff-id-frontend --detach
          railway up --service print-backend --detach
          railway up --service print-frontend --detach
          railway up --service sticker-backend --detach
          railway up --service sticker-frontend --detach
          railway up --service account-backend --detach
          railway up --service account-frontend --detach
          
          echo "⏳ Waiting for services to be ready..."
          sleep 30
      
      - name: Run Database Migrations
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🗄️ Running database migrations..."
          railway run --service main-backend php artisan migrate --force
          railway run --service staff-id-backend php artisan migrate --force
          railway run --service print-backend php artisan migrate --force
          railway run --service sticker-backend php artisan migrate --force
          railway run --service account-backend php artisan migrate --force
      
      - name: Clear Application Caches
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🧹 Clearing application caches..."
          railway run --service main-backend php artisan config:clear
          railway run --service main-backend php artisan route:clear
          railway run --service main-backend php artisan view:clear
          
          railway run --service staff-id-backend php artisan config:clear
          railway run --service print-backend php artisan config:clear
          railway run --service sticker-backend php artisan config:clear
          railway run --service account-backend php artisan config:clear
      
      - name: Deployment Success Notification
        run: |
          echo "✅ Deployment completed successfully!"
          echo "📦 All 10 services deployed"
          echo "🗄️ Database migrations executed"
          echo "🧹 Caches cleared"
          echo "🎉 Your application is live!"
