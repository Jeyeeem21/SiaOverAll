name: integrated-system

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: integrated-system-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-RootPass123}
      MYSQL_DATABASE: ${DB_DATABASE:-business_center}
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    networks:
      - integrated-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pRootPass123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # phpMyAdmin (connects to local MySQL)
  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: integrated-system-phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-RootPass123}
      UPLOAD_LIMIT: 128M
    networks:
      - integrated-network
    depends_on:
      mysql:
        condition: service_healthy

  # Main System - Business Center
  main-backend:
    build: ./main-system/laravel-backend
    working_dir: /var/www/html
    volumes:
      - ./main-system/laravel-backend:/var/www/html
      - main_vendor:/var/www/html/vendor
    ports:
      - "${MAIN_BACKEND_PORT:-8000}:8000"
    environment:
      APP_URL: ${MAIN_BACKEND_URL:-http://localhost:8000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177}
    networks:
      - integrated-network
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=8000"

  main-frontend:
    build: ./main-system/react-frontend
    working_dir: /app
    volumes:
      - ./main-system/react-frontend:/app
      - main_node_modules:/app/node_modules
    ports:
      - "${MAIN_FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${MAIN_API_URL:-http://localhost:8000/api}
      VITE_PRINT_API_URL: ${PRINT_API_URL:-http://localhost:8002/api/v1}
      VITE_STAFF_ID_API_URL: ${STAFF_ID_API_URL:-http://localhost:8001/api}
      VITE_STICKER_API_URL: ${STICKER_API_URL:-http://localhost:8003/api}
      VITE_STAFF_ID_URL: ${STAFF_ID_FRONTEND_URL:-http://localhost:5174}
      VITE_STUDENT_ACCOUNT_URL: ${ACCOUNT_FRONTEND_URL:-http://localhost:5177}
      VITE_STUDENT_REGISTER_URL: ${ACCOUNT_REGISTER_URL:-http://localhost:5177/register}
      VITE_HMR_CLIENT_PORT: ${MAIN_FRONTEND_PORT:-5173}
    networks:
      - integrated-network
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi; exec npm run dev -- --host 0.0.0.0 --port 5173"

  # Staff ID Management Module
  staff-id-backend:
    build: ./staff_id_managament/backend
    working_dir: /var/www/html
    volumes:
      - ./staff_id_managament/backend:/var/www/html
      - staff_id_vendor:/var/www/html/vendor
    ports:
      - "${STAFF_ID_BACKEND_PORT:-8001}:8000"
    environment:
      APP_URL: ${STAFF_ID_BACKEND_URL:-http://localhost:8001}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177}
    networks:
      - integrated-network
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=8000"

  staff-id-frontend:
    build: ./staff_id_managament/frontend
    working_dir: /app
    volumes:
      - ./staff_id_managament/frontend:/app
      - staff_id_node_modules:/app/node_modules
    ports:
      - "${STAFF_ID_FRONTEND_PORT:-5174}:5173"
    environment:
      VITE_API_URL: ${STAFF_ID_API_URL:-http://localhost:8001/api}
      VITE_MAIN_SYSTEM_API_URL: ${MAIN_API_URL:-http://localhost:8000/api}
      VITE_MAIN_SYSTEM_URL: ${MAIN_FRONTEND_URL:-http://localhost:5173}
      VITE_HMR_CLIENT_PORT: ${STAFF_ID_FRONTEND_PORT:-5174}
    networks:
      - integrated-network
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi; exec npm run dev -- --host 0.0.0.0 --port 5173"

  # Student Print Module
  print-backend:
    build: ./Student_print_module/backend
    working_dir: /var/www/html
    volumes:
      - ./Student_print_module/backend:/var/www/html
      - print_vendor:/var/www/html/vendor
    ports:
      - "${PRINT_BACKEND_PORT:-8002}:8000"
    environment:
      APP_URL: ${PRINT_BACKEND_URL:-http://localhost:8002}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177}
    networks:
      - integrated-network
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=8000"

  print-frontend:
    build: ./Student_print_module/frontend
    working_dir: /app
    volumes:
      - ./Student_print_module/frontend:/app
      - print_node_modules:/app/node_modules
    ports:
      - "${PRINT_FRONTEND_PORT:-5175}:5173"
    environment:
      VITE_API_URL: ${PRINT_API_URL:-http://localhost:8002/api/v1}
      VITE_MAIN_SYSTEM_URL: ${MAIN_FRONTEND_URL:-http://localhost:5173}
      VITE_STUDENT_PORTAL_URL: ${ACCOUNT_FRONTEND_URL:-http://localhost:5177}
      VITE_HMR_CLIENT_PORT: ${PRINT_FRONTEND_PORT:-5175}
      PRINT_API_PROXY_TARGET: ${PRINT_API_PROXY_TARGET:-http://print-backend:8000}
    networks:
      - integrated-network
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi; exec npm run dev -- --host 0.0.0.0 --port 5173"

  # Staff Sticker Module
  sticker-backend:
    build: ./Staff_Sticker_module/laravel-backend
    working_dir: /var/www/html
    volumes:
      - ./Staff_Sticker_module/laravel-backend:/var/www/html
      - sticker_vendor:/var/www/html/vendor
    ports:
      - "${STICKER_BACKEND_PORT:-8003}:8000"
    environment:
      APP_URL: ${STICKER_BACKEND_URL:-http://localhost:8003}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177}
    networks:
      - integrated-network
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=8000"

  sticker-frontend:
    build: ./Staff_Sticker_module/react-frontend
    working_dir: /app
    volumes:
      - ./Staff_Sticker_module/react-frontend:/app
      - sticker_node_modules:/app/node_modules
    ports:
      - "${STICKER_FRONTEND_PORT:-5176}:5173"
    environment:
      VITE_API_URL: ${STICKER_API_URL:-http://localhost:8003/api}
      VITE_MAIN_SYSTEM_URL: ${MAIN_FRONTEND_URL:-http://localhost:5173}
      VITE_HMR_CLIENT_PORT: ${STICKER_FRONTEND_PORT:-5176}
    networks:
      - integrated-network
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi; exec npm run dev -- --host 0.0.0.0 --port 5173"

  # Student Account Module
  account-backend:
    build: ./student_account_module/backend
    working_dir: /var/www/html
    volumes:
      - ./student_account_module/backend:/var/www/html
      - account_vendor:/var/www/html/vendor
    ports:
      - "${ACCOUNT_BACKEND_PORT:-8004}:8000"
    environment:
      APP_URL: ${ACCOUNT_BACKEND_URL:-http://localhost:8004}
      FRONTEND_URL: ${ACCOUNT_FRONTEND_URL:-http://localhost:5177}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177}
      CORE_API_URL: http://main-backend:8000/api
      MAIN_SYSTEM_API_URL: http://main-backend:8000/api
    networks:
      - integrated-network
    depends_on:
      mysql:
        condition: service_healthy
    command: sh -c "composer install --no-interaction && php artisan serve --host=0.0.0.0 --port=8000"

  account-frontend:
    build: ./student_account_module/frontend
    working_dir: /app
    volumes:
      - ./student_account_module/frontend:/app
      - account_node_modules:/app/node_modules
    ports:
      - "${ACCOUNT_FRONTEND_PORT:-5177}:5173"
    environment:
      VITE_API_URL: ${ACCOUNT_API_URL:-http://localhost:8004/api}
      VITE_MAIN_SYSTEM_URL: ${MAIN_FRONTEND_URL:-http://localhost:5173}
      VITE_MAIN_SYSTEM_API_URL: ${MAIN_API_URL:-http://localhost:8000/api}
      VITE_PRINT_API_URL: ${PRINT_API_URL:-http://localhost:8002/api/v1}
      VITE_PRINT_FRONTEND_URL: ${PRINT_FRONTEND_URL:-http://localhost:5175}
      VITE_ID_MANAGEMENT_API_URL: ${STAFF_ID_API_URL:-http://localhost:8001/api}
      VITE_HMR_CLIENT_PORT: ${ACCOUNT_FRONTEND_PORT:-5177}
    networks:
      - integrated-network
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then npm ci; fi; exec npm run dev -- --host 0.0.0.0 --port 5173"

networks:
  integrated-network:
    driver: bridge

volumes:
  mysql_data:
  main_vendor:
  main_node_modules:
  staff_id_vendor:
  staff_id_node_modules:
  print_vendor:
  print_node_modules:
  sticker_vendor:
  sticker_node_modules:
  account_vendor:
  account_node_modules:
